<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <!-- Файлы конструктора вынесены в папку /builder/. base href делает все относительные пути (css, js, content.js, assets) отсчитываемыми от корня сайта. -->
  <base href="../">
  <title>Конструктор контента — Dungeon Relics</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="builder/builder.css">
</head>
<body class="builder" data-page="builder">
  <header id="site-nav"></header>
  <main>
    <section class="page-hero">
      <span class="torch" style="left:10%;top:70px"><span class="torch__flame"></span><span class="torch__stick"></span></span>
      <span class="torch" style="right:10%;top:70px"><span class="torch__flame"></span><span class="torch__stick"></span></span>
      <div class="wrap">
        <div class="kicker" id="b-kicker">Режим редактирования</div>
        <h1 id="b-title">Конструктор контента</h1>
        <p id="b-sub">Редактируйте прямо на странице, как на сайте.</p>
      </div>
    </section>
    <section class="pad-sm">
      <div class="wrap">
        <aside id="build-panel"></aside>
        <div id="page-content"></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <div class="toast" id="toast"></div>

  <script src="js/i18n.js"></script>
  <script src="content.js"></script>
  <script src="js/data.js"></script>
  <script src="builder/builder.js"></script>
</body>
</html>
